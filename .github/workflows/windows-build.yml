name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test and build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test packaged UI
        shell: pwsh
        run: ./scripts/smoke_windows.ps1
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Veylora-Windows
          path: release/Veylora-Windows.zip
          if-no-files-found: error
          retention-days: 14
